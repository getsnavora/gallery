<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061b3d">
  <meta name="description" content="Explore moments from Navora: fresh food, thoughtful packaging, local stores, delivery, and community.">
  <title>Gallery | Navora</title>
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/gallery.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <img class="hero-photo" src="assets/images/hero.webp" alt="Woman smiling as she unpacks fresh vegetables from a grocery bag in her kitchen" fetchpriority="high">
      <div class="hero-tint" aria-hidden="true"></div>
      <header class="site-header">
        <a class="brand-link" href="#top" aria-label="Navora, back to top">
          <img src="assets/brand/navora-logo.png" alt="Navora" width="246" height="164">
        </a>
      </header>
      <div class="hero-copy" id="top">
        <p class="eyebrow">OUR GALLERY</p>
        <h1 id="page-title">Moments<br>That <span>Matter</span><i class="spark spark-one" aria-hidden="true"></i><i class="spark spark-two" aria-hidden="true"></i></h1>
        <p class="hero-description">From fresh products and thoughtful packaging to our app, riders, stores and real people — explore the Navora experience across every moment.</p>
        <a class="explore-button" href="#gallery">Explore Gallery <span aria-hidden="true">⟶</span></a>
      </div>
      <p class="hero-scribble" aria-hidden="true">Good<br>Food<br>Brighter<br>Days <span>♡</span></p>
      <svg class="hero-wave" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 65 C125 95 210 88 330 51 C455 10 490 23 560 62 C675 115 780 77 860 63 C950 46 1030 68 1110 58 C1150 55 1180 41 1200 27 L1200 90 L0 90 Z"></path></svg>
    </section>

    <section class="gallery-section" id="gallery" aria-label="Navora photo gallery">
      <div class="filter-list" role="group" aria-label="Filter gallery by category">
        <button class="filter-button is-active" type="button" data-filter="All" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="App" aria-pressed="false">App</button>
        <button class="filter-button" type="button" data-filter="Packaging" aria-pressed="false">Packaging</button>
        <button class="filter-button" type="button" data-filter="Stores" aria-pressed="false">Stores</button>
        <button class="filter-button" type="button" data-filter="Delivery" aria-pressed="false">Delivery</button>
        <button class="filter-button" type="button" data-filter="Brand" aria-pressed="false">Brand</button>
        <button class="filter-button" type="button" data-filter="Community" aria-pressed="false">Community</button>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-title" aria-describedby="lightbox-description">
    <div class="lightbox-shell">
      <div class="lightbox-topbar">
        <span class="category-pill" id="lightbox-category"></span>
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close image viewer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
        </button>
      </div>
      <div class="lightbox-image-wrap" id="lightbox-image-wrap">
        <img id="lightbox-image" alt="">
        <button class="lightbox-arrow previous" id="lightbox-previous" type="button" aria-label="Previous image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"></path></svg>
        </button>
        <button class="lightbox-arrow next" id="lightbox-next" type="button" aria-label="Next image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"></path></svg>
        </button>
      </div>
      <div class="lightbox-meta">
        <div><h2 id="lightbox-title"></h2><p id="lightbox-description"></p></div>
        <span class="lightbox-count" id="lightbox-count" aria-live="polite"></span>
      </div>
      <div class="thumbnail-wrap"><div class="thumbnail-list" id="thumbnail-list" aria-label="Choose an image"></div></div>
    </div>
  </dialog>
</body>
</html>
